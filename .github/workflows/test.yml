name: Test Skills

on:
  push:
    branches: [master, develop]
    paths:
      - 'synapse-*/**'
      - 'tests/**'
      - 'scripts/**'
      - 'adapters/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'synapse-*/**'
      - 'tests/**'
      - 'scripts/**'
      - 'adapters/**'
      - '.github/workflows/test.yml'

jobs:
  validate-structure:
    name: Validate skill structure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - synapse-graph-memory
          - synapse-timeline
          - synapse-daily-note
          - synapse-init
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          SKILL_DIR="${{ matrix.skill }}"
          for required in SKILL.md evals/evals.json; do
            if [ ! -f "$SKILL_DIR/$required" ]; then
              echo "ERROR: $SKILL_DIR/$required is missing"
              exit 1
            fi
          done
          echo "Structure check passed for ${{ matrix.skill }}"

      - name: Validate SKILL.md frontmatter
        run: |
          SKILL_DIR="${{ matrix.skill }}"
          head -10 "$SKILL_DIR/SKILL.md" | grep -q "^---$" || {
            echo "ERROR: Missing YAML frontmatter"
            exit 1
          }
          head -10 "$SKILL_DIR/SKILL.md" | grep -q "^name:" || {
            echo "ERROR: Missing 'name' field in frontmatter"
            exit 1
          }
          head -10 "$SKILL_DIR/SKILL.md" | grep -q "^description:" || {
            echo "ERROR: Missing 'description' field in frontmatter"
            exit 1
          }
          echo "Frontmatter valid"

  dist-check:
    name: Single-source distribution drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synced skill scripts match the canonical core
        run: python3 scripts/build_dist.py --check

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint all .sh files (error severity blocks the build)
        run: |
          mapfile -t scripts < <(find synapse-*/scripts tests -name '*.sh' -print | sort)
          echo "Checking ${#scripts[@]} scripts with shellcheck -S error"
          shellcheck -S error "${scripts[@]}"

  test-offline:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline test suite
        shell: bash
        env:
          PYTHON_BIN: python
        run: |
          bash tests/test_runner.sh --all
          bash tests/test_generate_memory_map_py.sh
          bash tests/test_suggest_edges_fast.sh
          bash tests/test_suggest_edges_dedup.sh
          python tests/test_memory_inbox.py
          python tests/test_project_resume.py
          python tests/test_audit_regressions.py

  validate-eval-fixtures:
    name: Validate eval fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate evals.json files
        run: python3 scripts/validate_fixtures.py evals

  validate-adapters:
    name: Validate host adapters
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adapter list + install smoke test
        shell: bash
        run: |
          python adapters/install_adapter.py list
          T="$(mktemp -d)"
          python adapters/install_adapter.py auto --project "$T" >/dev/null
          python adapters/install_adapter.py claude-code --project "$T" >/dev/null
          python -m json.tool "$T/.claude/settings.json" >/dev/null
          python adapters/install_adapter.py codex --project "$T" >/dev/null
          grep -q "synapse:begin" "$T/AGENTS.md"
          rm -rf "$T"
          echo "Adapters OK"
