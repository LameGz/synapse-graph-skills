name: Lint

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint README files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            README.zh-CN.md
            docs/*.md
          config: .markdownlint.json

  jsonlint:
    name: JSON lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all JSON files
        run: python3 scripts/validate_fixtures.py json

  yamllint:
    name: YAML frontmatter lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML frontmatter in SKILL.md files
        run: python3 scripts/validate_fixtures.py frontmatter
